[project]
name = "hai-mr05"
version = "0.0.0"
description = "HAI MR-05 qualified deterministic runtime with live external execution unavailable"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hai-mr05 = "hai_mr05.cli:main"

[tool.hai_mr05.skeleton]
phase = "HAI-MR-05C-R2"
package = "hai_mr05"
source_root = "src/hai_mr05/"
test_root = "tests/"
test_command = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -m unittest discover -s tests -v"
implementation = "HISTORICAL_FROZEN_BASELINE"

[tool.hai_mr05.runtime]
qualified_through = "HAI-ARCH-01-R2"
deterministic_runtime = "QUALIFIED_IMPLEMENTED"
multi_agent_governance_contract = "CANONICAL_SIBLING_LANES_QUALIFIED"
memory_governance_contract = "GIT_EVIDENCE_PCL_OBSIDIAN_AGENT_MEMORY_PRIORITY_QUALIFIED"
cross_agent_coordination_contract = "INWJUD_MEDIATED_NO_DIRECT_PEER_CALLS_QUALIFIED"
run_ledger_contract = "HASH_CHAINED_TAMPER_EVIDENT_RECORDS_QUALIFIED"
hermes_local_worker_authority = "BOUNDED_LOCAL_ONLY_EXTERNAL_RUNTIME"
codex_independent_reviewer_authority = "READ_ONLY_EXTERNAL_RUNTIME_LIVE_INFERENCE_BLOCKED_BY_POLICY"
cli = "OFFLINE_APPROVED_LOCAL_SOURCE_MATERIALIZATION_TWO_STEP_PRELIVE_QUALIFIED"
offline_cli_transport = "STDIN_JSON_LOCAL_PREPARE_OR_MATERIALIZE_OR_ONE_SHOT_OR_PREPARE_RESUME_PREOBTAINED_RESPONSE_ONLY"
local_source_prepare_orchestration = "APPROVED_ROOT_SINGLE_FILE_ZERO_SEND_QUALIFIED"
local_filesystem_source_read = "QUALIFIED_APPROVED_ROOT_SINGLE_FILE_ONLY"
local_prepare_input_materialization = "QUALIFIED"
pre_send_handoff = "ZERO_SEND_QUALIFIED"
two_step_resume = "PREOBTAINED_RESPONSE_ONLY"
live_external_execution = "NOT_IMPLEMENTED"
network_authority = false
provider_client_authority = false
model_call_authority = false
model_routing_authority = false
authentication_authority = false
auto_retry_authority = false
auto_fallback_authority = false
human_approval_execution_authority = false
human_decision_side_effect_authority = false
state_transition_execution_authority = false
openclaw_production_execution_authority = false
